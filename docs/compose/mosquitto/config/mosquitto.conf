# Minimal broker for a trusted LAN: anonymous access and no TLS. Add a
# password_file (and drop allow_anonymous) before exposing it any further.
listener 1883
allow_anonymous true

# Persist retained messages, so Zigbee2MQTT's retained device state (which
# Homeland relies on) survives a broker restart.
persistence true
persistence_location /mosquitto/data/

log_dest stdout
