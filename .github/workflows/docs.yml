name: docs

# The main ci workflow ignores docs/** and *.md, so this one covers them:
# it verifies docs/README.md is regenerated from the example scripts, and that
# the examples are formatted and type-check against script.d.ts, whenever
# those files, the generator, the Makefile that includes docs/targets.mk or the
# UI tooling that checks them change.
on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'cmd/gen-docs/**'
      - 'Makefile'
      - 'ui/package-lock.json'
      - 'ui/.oxfmtrc.json'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'cmd/gen-docs/**'
      - 'Makefile'
      - 'ui/package-lock.json'
      - 'ui/.oxfmtrc.json'
      - '.github/workflows/docs.yml'

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  # A new push to a pull request supersedes its running checks.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  docs-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Docs up to date
        run: make docs-check
  examples-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22' # keep in sync with ci.yml and the Dockerfile
      - name: Format & type-check examples
        run: make docs-examples-fmt-check docs-examples-ts
